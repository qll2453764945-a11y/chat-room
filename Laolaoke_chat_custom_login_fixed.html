<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>唠唠嗑 · 聊天</title>
<style>
:root{color-scheme:light;--bg:#f7f7f8;--panel:#fff;--text:#202123;--muted:#777;--line:#e5e5e5;--accent:#202123;--soft:#f0f0f0;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px}
button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
#app{height:100dvh;display:flex;flex-direction:column;max-width:1100px;margin:auto;background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);flex-shrink:0}
.brand{font-size:16px;font-weight:650;display:flex;align-items:center;gap:10px}.brand-icon{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:#f0f0f0;font-size:18px}
.top-actions{display:flex;align-items:center;gap:10px}.user-label{color:var(--muted);font-size:13px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghost-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;color:var(--text)}.ghost-btn:hover{background:var(--soft)}
#messages{flex:1;overflow-y:auto;padding:28px 22px 20px;scroll-behavior:smooth}.welcome{text-align:center;margin:10vh auto 0;max-width:440px}.welcome h1{font-size:26px;font-weight:600;letter-spacing:-.5px;margin:0 0 12px}.welcome p{color:var(--muted);line-height:1.7;margin:0}
.message{display:flex;gap:12px;max-width:780px;margin:0 auto 24px;align-items:flex-start}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#ececec;color:#444;font-weight:650;flex-shrink:0;font-size:13px}.message-main{min-width:0;flex:1}.message-head{display:flex;align-items:baseline;gap:10px;margin:2px 0 7px}.message-name{font-size:14px;font-weight:650}.message-time{font-size:12px;color:#999}.message-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;font-size:15px}
.composer-wrap{padding:12px 20px 18px;border-top:1px solid var(--line);flex-shrink:0}.composer{max-width:780px;margin:auto;border:1px solid #d9d9d9;border-radius:16px;padding:10px 10px 10px 15px;display:flex;gap:10px;align-items:flex-end;background:#fff;box-shadow:0 2px 8px #00000008}.composer:focus-within{border-color:#aaa}.composer textarea{flex:1;resize:none;border:0;outline:0;max-height:180px;min-height:28px;padding:5px 0;line-height:1.55;background:transparent;color:var(--text)}.send-btn{width:36px;height:36px;border:0;border-radius:10px;background:#202123;color:white;font-size:18px;flex-shrink:0}.hint{text-align:center;color:#999;font-size:11px;margin-top:9px}
.overlay{position:fixed;inset:0;background:#f7f7f8;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.auth-card{width:100%;max-width:390px;background:white;border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 12px 50px #0000000a}.auth-brand{text-align:center;margin-bottom:24px}.auth-brand .brand-icon{margin:0 auto 12px;width:44px;height:44px;font-size:22px}.auth-brand h1{font-size:23px;margin:0 0 8px;font-weight:650}.auth-brand p{margin:0;color:var(--muted);font-size:13px}.field{margin:14px 0}.field label{display:block;font-size:13px;margin-bottom:7px;color:#555}.field input{width:100%;border:1px solid #d8d8d8;border-radius:9px;padding:12px;outline:none;background:white}.field input:focus{border-color:#888}.primary-btn{width:100%;border:0;border-radius:9px;padding:12px;background:#202123;color:white;font-weight:600;margin-top:8px}.switch-line{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}.text-btn{border:0;background:none;color:#202123;text-decoration:underline;padding:0 3px}.error{color:var(--danger);font-size:13px;line-height:1.5;margin-top:12px;min-height:18px}.hidden{display:none!important}
#profileOverlay{background:#0006}.profile-card{width:100%;max-width:400px;background:#fff;border-radius:16px;padding:24px;box-shadow:0 12px 50px #0003}.profile-title{display:flex;align-items:center;justify-content:space-between;font-size:18px;font-weight:650;margin-bottom:18px}.close-btn{border:0;background:transparent;font-size:24px;color:#777}.profile-note{font-size:12px;color:#888;line-height:1.6;margin-top:10px}
@media(max-width:600px){.topbar{padding:0 14px;height:58px}.user-label{max-width:100px}#messages{padding:22px 14px}.composer-wrap{padding:10px 12px 14px}.auth-card{padding:24px}.welcome{margin-top:12vh}.welcome h1{font-size:23px}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><div class="brand-icon">🍺</div><span>唠唠嗑</span></div>
    <div class="top-actions"><span id="userLabel" class="user-label"></span><button class="ghost-btn" id="profileBtn">个人信息</button><button class="ghost-btn" id="logoutBtn">退出</button></div>
  </header>
  <main id="messages">
    <div class="welcome" id="welcome"><h1>来聊点什么？</h1><p>唠唠嗑。发条消息，和大家轻松聊聊。</p></div>
  </main>
  <div class="composer-wrap"><form class="composer" id="composer"><textarea id="messageInput" rows="1" maxlength="3000" placeholder="发送消息……（Enter 发送，Shift + Enter 换行）"></textarea><button class="send-btn" id="sendBtn" type="submit" aria-label="发送">↑</button></form><div class="hint">请友善交流 · 消息会同步保存</div></div>
</div>

<div class="overlay" id="authOverlay">
  <div class="auth-card">
    <div class="auth-brand"><div class="brand-icon">🍺</div><h1>欢迎来唠唠嗑</h1><p>登录后继续聊天，账号会为你保存</p></div>
    <form id="authForm">
      <div class="field"><label for="authUsername">登录账号</label><input id="authUsername" maxlength="20" autocomplete="username" required placeholder="3–20 位字母、数字或 _ . -" /></div>
      <div class="field" id="displayNameField"><label for="authDisplayName">聊天昵称</label><input id="authDisplayName" maxlength="24" autocomplete="nickname" placeholder="其他人看到的名字" /></div>
      <div class="field"><label for="authPassword">密码</label><input id="authPassword" type="password" minlength="6" autocomplete="current-password" required placeholder="至少 6 位" /></div>
      <button class="primary-btn" id="authSubmit" type="submit">注册账号</button>
      <div class="error" id="authError" role="alert"></div>
    </form>
    <div class="switch-line"><span id="switchPrompt">已经有账号？</span><button class="text-btn" id="switchAuth" type="button">登录</button></div>
  </div>
</div>

<div class="overlay hidden" id="profileOverlay">
  <div class="profile-card">
    <div class="profile-title"><span>个人信息</span><button class="close-btn" id="closeProfile" aria-label="关闭">×</button></div>
    <form id="profileForm"><div class="field"><label for="profileAccount">登录账号</label><input id="profileAccount" disabled /></div><div class="field"><label for="profileUsername">聊天昵称</label><input id="profileUsername" maxlength="24" required placeholder="输入你想显示的名字" /></div><button class="primary-btn" type="submit">保存修改</button><div class="error" id="profileError" role="alert"></div></form>
    <div class="profile-note">登录账号用于下次登录，不能在此处修改。聊天昵称可以随时更改。</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getDatabase, ref, get, set, push, query, orderByChild, limitToLast, onChildAdded } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB-skHrH1xF0mHcbcFKoZlrXNeeioFCKSw",
  authDomain: "glasses-system.firebaseapp.com",
  projectId: "glasses-system",
  databaseURL: "https://glasses-system-default-rtdb.firebaseio.com"
};
const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getDatabase(firebaseApp);

let currentUser = null;
let currentUsername = "";
let authMode = "register";
let messageListenerStarted = false;
const profileCache = new Map();
// 防止重复的 Firebase child_added 监听器把同一条消息渲染多次。
const renderedMessageKeys = new Set();
let unsubscribeMessages = null;
const $ = id => document.getElementById(id);

function setAuthMode(mode) {
  authMode = mode;
  const registering = mode === "register";
  $("displayNameField").classList.toggle("hidden", !registering);
  $("authSubmit").textContent = registering ? "注册账号" : "登录";
  $("switchPrompt").textContent = registering ? "已经有账号？" : "还没有账号？";
  $("switchAuth").textContent = registering ? "登录" : "注册";
  $("authPassword").autocomplete = registering ? "new-password" : "current-password";
  $("authDisplayName").required = registering;
  $("authError").textContent = "";
}
$("switchAuth").addEventListener("click", () => setAuthMode(authMode === "register" ? "login" : "register"));

function friendlyAuthError(error) {
  const map = {
    "auth/email-already-in-use": "这个登录账号已经注册，请直接登录。",
    "auth/invalid-email": "登录账号格式不正确，请检查输入。",
    "auth/weak-password": "密码至少需要 6 位。",
    "auth/invalid-credential": "账号或密码不正确。",
    "auth/user-not-found": "没有找到这个账号，请检查账号或先注册。",
    "auth/wrong-password": "密码不正确。",
    "auth/too-many-requests": "尝试次数过多，请稍后再试。",
    "auth/network-request-failed": "网络连接失败，请检查网络后重试。",
    "auth/operation-not-allowed": "Firebase 尚未启用邮箱/密码登录，请到 Authentication 中开启。"
  };
  return map[error?.code] || (error?.message || "操作失败，请稍后重试。");
}

// 将用户自定义账号映射为 Firebase Authentication 可用的内部邮箱。
// 该邮箱仅用于 Firebase 身份验证，不需要真实邮箱，也不会展示给用户。
function normalizeAccount(value) { return value.trim().toLowerCase(); }
function accountToInternalEmail(value) { return normalizeAccount(value) + "@accounts.xiaojiuguan-login.com"; }
function validAccount(value) { return /^[a-zA-Z0-9][a-zA-Z0-9_-]{1,18}[a-zA-Z0-9]$/.test(value); }

$("authForm").addEventListener("submit", async e => {
  e.preventDefault();
  const accountRaw = $("authUsername").value.trim();
  const account = normalizeAccount(accountRaw);
  const internalEmail = accountToInternalEmail(account);
  const password = $("authPassword").value;
  const displayName = $("authDisplayName").value.trim();
  const button = $("authSubmit");
  $("authError").textContent = "";
  if (!validAccount(accountRaw)) { $("authError").textContent = "账号需为 3–20 位，只能使用英文字母、数字、下划线或短横线，且首尾必须是字母或数字。"; return; }
  if (authMode === "register" && !displayName) { $("authError").textContent = "请设置聊天昵称。"; return; }
  if (password.length < 6) { $("authError").textContent = "密码至少需要 6 位。"; return; }
  button.disabled = true;
  try {
    if (authMode === "register") {
      const credential = await createUserWithEmailAndPassword(auth, internalEmail, password);
      await updateProfile(credential.user, { displayName });
      await set(ref(db, `users/${credential.user.uid}`), { loginUsername: account, username: displayName, createdAt: Date.now() });
      currentUsername = displayName;
      profileCache.set(credential.user.uid, displayName);
    } else {
      const credential = await signInWithEmailAndPassword(auth, internalEmail, password);
      const snap = await get(ref(db, `users/${credential.user.uid}`));
      const profile = snap.val() || {};
      currentUsername = profile.username || credential.user.displayName || account;
      if (!snap.exists()) await set(ref(db, `users/${credential.user.uid}`), { loginUsername: account, username: currentUsername, createdAt: Date.now() });
      profileCache.set(credential.user.uid, currentUsername);
    }
    // onAuthStateChanged will reveal the chat and load messages.
  } catch (error) {
    $("authError").textContent = friendlyAuthError(error);
  } finally {
    button.disabled = false;
  }
});

onAuthStateChanged(auth, async user => {
  currentUser = user;
  if (!user) {
    $("authOverlay").classList.remove("hidden");
    $("app").classList.add("hidden");
    $("profileOverlay").classList.add("hidden");
    if (unsubscribeMessages) {
      unsubscribeMessages();
      unsubscribeMessages = null;
    }
    messageListenerStarted = false;
    renderedMessageKeys.clear();
    return;
  }
  try {
    const profileSnap = await get(ref(db, `users/${user.uid}`));
    const profile = profileSnap.val();
    currentUsername = profile?.username || user.displayName || "用户";
    if (!profile) await set(ref(db, `users/${user.uid}`), { username: currentUsername, loginUsername: (user.email || "").split("@")[0], createdAt: Date.now() });
    profileCache.set(user.uid, currentUsername);
    $("userLabel").textContent = currentUsername;
    $("authOverlay").classList.add("hidden");
    $("app").classList.remove("hidden");
    if (!messageListenerStarted) loadMessages();
  } catch (error) {
    $("authOverlay").classList.remove("hidden");
    $("authError").textContent = "读取个人信息失败：" + friendlyAuthError(error) + " 请检查 Realtime Database Rules。";
  }
});

async function getUsername(uid) {
  if (profileCache.has(uid)) return profileCache.get(uid);
  try {
    const snap = await get(ref(db, `users/${uid}/username`));
    const username = snap.val() || "用户";
    profileCache.set(uid, username);
    return username;
  } catch { return "用户"; }
}
function formatTime(value) {
  if (!value) return "刚刚";
  return new Intl.DateTimeFormat("zh-CN", { hour: "2-digit", minute: "2-digit" }).format(new Date(value));
}
function addMessage(message, key) {
  if (!message || !message.uid || typeof message.text !== "string") return;
  // Firebase 的同一条消息只允许在界面渲染一次，即使监听器意外重复注册。
  if (key && renderedMessageKeys.has(key)) return;
  if (key) renderedMessageKeys.add(key);
  $("welcome").classList.add("hidden");
  const row = document.createElement("article");
  row.className = "message";
  row.dataset.key = key || "";
  row.dataset.uid = message.uid;
  const avatar = document.createElement("div"); avatar.className = "avatar";
  const main = document.createElement("div"); main.className = "message-main";
  const head = document.createElement("div"); head.className = "message-head";
  const name = document.createElement("span"); name.className = "message-name";
  const time = document.createElement("span"); time.className = "message-time"; time.textContent = formatTime(message.createdAt);
  const body = document.createElement("div"); body.className = "message-text"; body.textContent = message.text;
  head.append(name, time); main.append(head, body); row.append(avatar, main);
  getUsername(message.uid).then(username => {
    name.textContent = username;
    avatar.textContent = [...username][0] || "?";
    if (message.uid === currentUser?.uid) avatar.style.background = "#202123", avatar.style.color = "#fff";
  });
  $("messages").appendChild(row);
  $("messages").scrollTop = $("messages").scrollHeight;
}
function loadMessages() {
  if (messageListenerStarted) return;
  messageListenerStarted = true;
  const messagesQuery = query(ref(db, "chat/messages"), orderByChild("createdAt"), limitToLast(100));
  unsubscribeMessages = onChildAdded(messagesQuery, snap => addMessage(snap.val(), snap.key), error => {
    console.error(error);
    $("authError").textContent = "聊天记录读取失败，请检查数据库规则。";
  });
}

$("composer").addEventListener("submit", async e => {
  e.preventDefault();
  if (!currentUser) return;
  const input = $("messageInput");
  const text = input.value.trim();
  if (!text) return;
  const button = $("sendBtn"); button.disabled = true;
  try {
    await push(ref(db, "chat/messages"), { uid: currentUser.uid, text, createdAt: Date.now() });
    input.value = ""; input.style.height = "auto";
  } catch (error) {
    alert("发送失败：" + friendlyAuthError(error) + "\n请检查 Realtime Database Rules。");
  } finally { button.disabled = false; input.focus(); }
});
$("messageInput").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 180) + "px"; });
$("messageInput").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("composer").requestSubmit(); } });

$("profileBtn").addEventListener("click", () => {
  if (!currentUser) return;
  $("profileUsername").value = currentUsername;
  get(ref(db, `users/${currentUser.uid}/loginUsername`)).then(snap => { $("profileAccount").value = snap.val() || ""; });
  $("profileError").textContent = "";
  $("profileOverlay").classList.remove("hidden");
});
$("closeProfile").addEventListener("click", () => $("profileOverlay").classList.add("hidden"));
$("profileOverlay").addEventListener("click", e => { if (e.target === $("profileOverlay")) $("profileOverlay").classList.add("hidden"); });
$("profileForm").addEventListener("submit", async e => {
  e.preventDefault();
  const username = $("profileUsername").value.trim();
  if (!username) { $("profileError").textContent = "用户名不能为空。"; return; }
  try {
    const oldProfile = await get(ref(db, `users/${currentUser.uid}`));
    const oldCreatedAt = oldProfile.val()?.createdAt || Date.now();
    const oldData = oldProfile.val() || {};
    await set(ref(db, `users/${currentUser.uid}`), { username, loginUsername: oldData.loginUsername || (currentUser.email || "").split("@")[0], createdAt: oldCreatedAt });
    await updateProfile(currentUser, { displayName: username });
    currentUsername = username; profileCache.set(currentUser.uid, username);
    $("userLabel").textContent = username;
    $("profileOverlay").classList.add("hidden");
    // Update names on currently visible messages without changing their content.
    document.querySelectorAll(`.message[data-uid="${currentUser.uid}"]`).forEach(row => { const name = row.querySelector(".message-name"); const avatar = row.querySelector(".avatar"); if (name) name.textContent = username; if (avatar) avatar.textContent = [...username][0] || "?"; });
  } catch (error) { $("profileError").textContent = "保存失败：" + friendlyAuthError(error); }
});
$("logoutBtn").addEventListener("click", async () => {
  if (confirm("确定退出登录吗？")) { try { await signOut(auth); setAuthMode("login"); } catch (error) { alert(friendlyAuthError(error)); } }
});
</script>
</body>
</html>
